<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 780" width="400" height="780" style="background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <rect x="0" y="0" width="400" height="780" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  
  <!-- Status Bar -->
  <rect x="0" y="0" width="400" height="40" rx="20" fill="#0F172A"/>
  <text x="34" y="24" fill="#FFFFFF" font-size="12" font-weight="600">14:55</text>
  <text x="350" y="24" fill="#FFFFFF" font-size="11">100% 🔋</text>

  <!-- App Header -->
  <rect x="0" y="40" width="400" height="65" fill="#FFFFFF"/>

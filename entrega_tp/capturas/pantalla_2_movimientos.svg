<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 780" width="400" height="780" style="background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <rect x="0" y="0" width="400" height="780" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  
  <!-- Status Bar -->
  <rect x="0" y="0" width="400" height="40" rx="20" fill="#0F172A"/>
  <text x="34" y="24" fill="#FFFFFF" font-size="12" font-weight="600">14:55</text>
  <text x="350" y="24" fill="#FFFFFF" font-size="11">100% 🔋</text>

  <!-- App Header -->
  <rect x="0" y="40" width="400" height="65" fill="#FFFFFF"/>
  <line x1="0" y1="105" x2="400" y2="105" stroke="#F1F5F9" stroke-width="2"/>
  <text x="20" y="70" font-size="20" font-weight="bold" fill="#0F172A">Movimientos</text>
  <text x="20" y="88" font-size="12" fill="#64748B">Historial y registros en SQLite</text>
  <rect x="300" y="60" width="80" height="30" rx="15" fill="#EFF6FF"/>
  <text x="316" y="80" font-size="12" font-weight="bold" fill="#2563EB">+ Nuevo</text>

  <!-- Search and Filters Section -->
  <g transform="translate(20, 115)">
    <!-- Search Bar -->
    <rect width="360" height="42" rx="12" fill="#F1F5F9"/>
    <text x="14" y="26" font-size="14" fill="#94A3B8">🔍</text>
    <text x="38" y="26" font-size="13" fill="#94A3B8">Buscar por descripción o categoría...</text>
    
    <!-- Type Chips Row -->
    <g transform="translate(0, 52)">
      <!-- Chip Todos Active -->
      <rect x="0" y="0" width="84" height="28" rx="14" fill="#0F172A"/>
      <text x="14" y="18" font-size="11" font-weight="bold" fill="#FFFFFF">Todos (16)</text>
      
      <!-- Chip Gastos -->
      <rect x="92" y="0" width="80" height="28" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
      <text x="104" y="18" font-size="11" font-weight="600" fill="#DC2626">⬇ Gastos</text>
      
      <!-- Chip Ingresos -->
      <rect x="180" y="0" width="88" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="194" y="18" font-size="11" font-weight="600" fill="#64748B">⬆ Ingresos</text>
    </g>

    <!-- Category Chips Scroll -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="80" height="26" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
      <text x="12" y="17" font-size="11" font-weight="bold" fill="#2563EB">Todas</text>
      
      <rect x="88" y="0" width="105" height="26" rx="13" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="98" cy="13" r="4" fill="#EF4444"/>
      <text x="108" y="17" font-size="11" fill="#475569">Alimentación</text>
      
      <rect x="201" y="0" width="95" height="26" rx="13" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="211" cy="13" r="4" fill="#F59E0B"/>
      <text x="221" y="17" font-size="11" fill="#475569">Transporte</text>
      
      <rect x="304" y="0" width="56" height="26" rx="13" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="314" cy="13" r="4" fill="#3B82F6"/>
      <text x="324" y="17" font-size="11" fill="#475569">Hogar</text>
    </g>
  </g>

  <!-- Subtotal Bar -->
  <rect x="0" y="245" width="400" height="32" fill="#F1F5F9"/>
  <text x="20" y="265" font-size="11" fill="#64748B">16 resultados encontrados</text>
  <text x="250" y="265" font-size="11" fill="#334155">Balance: <tspan font-weight="bold" fill="#0F172A">+$ 67.400,00</tspan></text>

  <!-- Transactions List -->
  <g transform="translate(20, 290)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <circle cx="28" cy="33" r="18" fill="#FEE2E2"/>
    <text x="20" y="39" font-size="16">👟</text>
    <text x="56" y="26" font-size="14" font-weight="bold" fill="#0F172A">Ropa y Calzado</text>
    <text x="56" y="42" font-size="11" fill="#64748B">Zapatillas en liquidación</text>
    <text x="56" y="56" font-size="10" fill="#94A3B8">Ayer • 30 Oct</text>
    <text x="260" y="30" font-size="14" font-weight="bold" fill="#EF4444">- $ 16.800,00</text>
    <text x="290" y="52" font-size="12" fill="#64748B">✏️ 🗑️</text>

    <!-- Item 2 -->
    <rect x="0" y="74" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <circle cx="28" cy="107" r="18" fill="#D1FAE5"/>
    <text x="20" y="113" font-size="16">🏷️</text>
    <text x="56" y="100" font-size="14" font-weight="bold" fill="#0F172A">Ventas</text>
    <text x="56" y="116" font-size="11" fill="#64748B">Venta de monitor usado</text>
    <text x="56" y="130" font-size="10" fill="#94A3B8">29 Oct</text>
    <text x="255" y="104" font-size="14" font-weight="bold" fill="#10B981">+ $ 15.000,00</text>
    <text x="290" y="126" font-size="12" fill="#64748B">✏️ 🗑️</text>

    <!-- Item 3 -->
    <rect x="0" y="148" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <circle cx="28" cy="181" r="18" fill="#FEE2E2"/>
    <text x="20" y="187" font-size="16">🍔</text>
    <text x="56" y="174" font-size="14" font-weight="bold" fill="#0F172A">Alimentación</text>
    <text x="56" y="190" font-size="11" fill="#64748B">Almuerzo laboral y cafés</text>
    <text x="56" y="204" font-size="10" fill="#94A3B8">29 Oct</text>
    <text x="260" y="178" font-size="14" font-weight="bold" fill="#EF4444">- $ 11.200,00</text>
    <text x="290" y="200" font-size="12" fill="#64748B">✏️ 🗑️</text>

    <!-- Item 4 -->
    <rect x="0" y="222" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <circle cx="28" cy="255" r="18" fill="#EFF6FF"/>
    <text x="20" y="261" font-size="16">🚕</text>
    <text x="56" y="248" font-size="14" font-weight="bold" fill="#0F172A">Transporte</text>
    <text x="56" y="264" font-size="11" fill="#64748B">Viaje en taxi a reunión</text>
    <text x="56" y="278" font-size="10" fill="#94A3B8">27 Oct</text>
    <text x="265" y="252" font-size="14" font-weight="bold" fill="#EF4444">- $ 4.500,00</text>
    <text x="290" y="274" font-size="12" fill="#64748B">✏️ 🗑️</text>

    <!-- Item 5 -->
    <rect x="0" y="296" width="360" height="66" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <circle cx="28" cy="329" r="18" fill="#F3E8FF"/>
    <text x="20" y="335" font-size="16">🎓</text>
    <text x="56" y="322" font-size="14" font-weight="bold" fill="#0F172A">Educación</text>
    <text x="56" y="338" font-size="11" fill="#64748B">Cuota curso programación</text>
    <text x="56" y="352" font-size="10" fill="#94A3B8">25 Oct</text>
    <text x="260" y="326" font-size="14" font-weight="bold" fill="#EF4444">- $ 19.500,00</text>
    <text x="290" y="348" font-size="12" fill="#64748B">✏️ 🗑️</text>
  </g>

  <!-- Floating Action Button (FAB) -->
  <circle cx="340" cy="670" r="26" fill="#2563EB" filter="drop-shadow(0 4px 6px rgba(37,99,235,0.4))"/>
  <text x="330" y="678" font-size="26" font-weight="bold" fill="#FFFFFF">+</text>

  <!-- Bottom Navigation Bar -->
  <rect x="0" y="715" width="400" height="65" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Tab 1: Inicio -->
  <text x="41" y="741" font-size="14" fill="#94A3B8">🏠</text>
  <text x="35" y="762" font-size="10" font-weight="500" fill="#64748B">Inicio</text>
  
  <!-- Tab 2 Active: Movimientos -->
  <rect x="115" y="722" width="70" height="28" rx="14" fill="#EFF6FF"/>
  <text x="144" y="741" font-size="14" fill="#2563EB">⇄</text>
  <text x="122" y="762" font-size="10" font-weight="bold" fill="#2563EB">Movimientos</text>
  
  <!-- Tab 3: Informes -->
  <text x="235" y="741" font-size="14" fill="#94A3B8">📊</text>
  <text x="222" y="762" font-size="10" font-weight="500" fill="#64748B">Informes</text>
  
  <!-- Tab 4: Categorías -->
  <text x="335" y="741" font-size="14" fill="#94A3B8">⚙️</text>
  <text x="318" y="762" font-size="10" font-weight="500" fill="#64748B">Categorías</text>
</svg>

